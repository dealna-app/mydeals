<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dealna | Best Deals in Morocco</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Dealna</h1>
    <p id="subtitle">Best Deals & Promo Codes in Morocco</p>

    <div class="controls">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search deals or stores..."
        onkeyup="searchDeals()"
      />

      <div class="lang-switch">
        <button onclick="setLanguage('en')">EN</button>
        <button onclick="setLanguage('ar')">AR</button>
      </div>
    </div>
  </header>

  <div class="filters">
    <button onclick="filterDeals('all')">All</button>
    <button onclick="filterDeals('fashion')">Fashion</button>
    <button onclick="filterDeals('food')">Food</button>
    <button onclick="filterDeals('electronics')">Electronics</button>
    <button onclick="filterDeals('local')">Local</button>
  </div>

  <main id="deals"></main>

  <footer>
    <p>© 2026 Dealna — Made in Morocco 🇲🇦</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
